name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    # Linux is not a supported target yet, but internal packages must keep
    # cross-compiling for the planned port
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build internal packages
        run: go build ./internal/...

      - name: Test
        run: go test ./internal/...

      # main.go embeds frontend/dist; the linter type-checks the root package
      # and needs the directory to exist, the contents do not matter here
      - name: Placeholder frontend bundle for typecheck
        run: mkdir -p frontend/dist && echo placeholder > frontend/dist/index.html

      - name: Lint (Go)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (frontend)
        working-directory: frontend
        run: npm run lint

      - name: Test
        run: go test ./internal/...

      - name: Build
        run: wails build -platform darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberLife-darwin
          path: build/bin/*.app
