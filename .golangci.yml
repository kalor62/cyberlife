version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  exclusions:
    paths:
      - frontend/node_modules

  settings:
    errcheck:
      # Fire-and-forget cleanups where the error genuinely has no action
      exclude-functions:
        - (io.Closer).Close

formatters:
  enable:
    - gofmt
